  <path d="M32 16.5c0-4.5 3.5-4.5 3.5-9" stroke="#E0C48C" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M40 18.5c0-4 3.5-4 3.5-8" stroke="#E0C48C" stroke-width="3.4" stroke-linecap="round" fill="none"/>
